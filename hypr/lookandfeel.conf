
# ============================================
# Nazuna Nanakusa Theme - Look and Feel
# ~/.config/hypr/lookandfeel.conf
# ============================================

# General settings
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 1
    
    # Nazuna's colors - deep purple borders with pink accent
    col.active_border = rgba(b968c7ff) rgba(7b68eeff) 45deg
    col.inactive_border = rgba(2d2a4eff)
    
    layout = dwindle
    allow_tearing = true
}

# Decoration
decoration {
    rounding = 8
    
    blur {
        enabled = false
        size = 3
        passes = 1
        new_optimizations = false
        ignore_opacity = true
        noise = 0.05
        contrast = 1.1
        brightness = 1.0
    }
}

# Animations - smooth and floaty like nighttime
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = overshot, 0.13, 0.99, 0.29, 1.1
    
    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 100, default, loop
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, overshot, slidevert
}

# Layout
dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

# Misc - Nazuna theme background
misc {
    background_color = rgba(16141fff)
}
color-scheme = prefer-dark

