# Example Theme Configuration
# This file demonstrates all available theme configuration options for Vicinae.
# You don't need to define all of these - only override what you want to customize.
# Undefined colors will be automatically derived from core colors or inherited from base themes.
#
# Where a color name is expected, you can use the following hex formats:
# #RGB
# #RRGGBB
# #AARRGGBB (with alpha)
# 'transparent' (no color)
# <color_ref> (e.g 'colors.accents.red'): references this theme's definition if available, the parent's otherwise
#
# Where a color is expected, you can either use a simple string for the color name or the following table syntax:
# [colors.core]
# accent = "accents.color.red"
# OR:
# accent = { name = "accents.color.red", opacity = 0.5 }
# OR:
# accent = { name = "accents.color.red", lighter = 100 }
# OR:
# accent = { name = "accents.color.red", darker = 150 }

[meta]
name = "Nazuna Nanakusa"                         # Display name shown in theme picker
description = "A theme inspired by Nazuna Nanakusa from Call of the Night"  # Description shown in theme picker
variant = "dark"                              # Theme variant: "dark" or "light". Every dark theme inherits from vicinae-dark and every light theme from vicinae-light. 
inherits = "vicinae-dark"                     # Optional: inherit from another theme (e.g., "vicinae-dark")

# ============================================================================
# Core Colors
# ============================================================================
# These are the most important colors that define your theme's overall look.
# Most other colors can be automatically derived from these if not specified.

[colors.core]
accent = "#D946EF"              # Primary accent color - Nazuna's signature fuchsia
accent_foreground = "#FFFFFF"   # Text color on accent-colored backgrounds
background = "#0F0A1F"          # Main application background - deep midnight purple
foreground = "#F5F3FF"          # Primary text color - light lavender
secondary_background = "#1A1229" # Background for surfaces elevated above main
border = "#D946EF"              # Default border color - matches accent

# ============================================================================
# Window-Specific Colors
# ============================================================================
# Override border colors for specific window types

[colors.main_window]
border = "#D946EF"

[colors.settings_window]
border = "#A855F7"

# ============================================================================
# Accent Colors
# ============================================================================
# Your color palette, central to your theme's identity

[colors.accents]
blue = "#818CF8"
green = "#34D399"
magenta = "#D946EF"
orange = "#FB923C"
red = "#EF4444"
yellow = "#FCD34D"
cyan = "#22D3EE"
purple = "#A855F7"

# ============================================================================
# Text Colors
# ============================================================================
# Colors for various text states and meanings

[colors.text]
default = "#F5F3FF"             # Light lavender for primary text
muted = "#C4B5FD"               # Softer purple for secondary text
danger = "#EF4444"              # Red for errors
success = "#34D399"             # Green for success states
placeholder = "#9CA3AF"			# Gray for placeholders
selection = { background = "#2D1B4E", foreground = "#FFFFFF" }

[colors.text.links]
default = "#F0ABFC"
visited = "#A855F7"

# ============================================================================
# Input Fields
# ============================================================================
# Colors for text inputs, search boxes, etc.

[colors.input]
border = "#D946EF"
border_focus = "#EC4899"
border_error = "#EF4444"

# ============================================================================
# Buttons
# ============================================================================
# Colors for button states

[colors.button.primary] 
background = "#D946EF"
foreground = "#FFFFFF"
hover = { background = "#EC4899" }
focus = { outline = "#F0ABFC" }

# ============================================================================
# Lists
# ============================================================================
# Colors for list items (horizontal list views)

[colors.list.item.hover]
background = "#2D1B4E"
foreground = "#F5F3FF"

[colors.list.item.selection]
background = "#D946EF"          # Selected item on main background
foreground = "#FFFFFF"
secondary_background = "#EC4899" # Selected item on secondary surfaces
secondary_foreground = "#FFFFFF"

# ============================================================================
# Grid Items
# ============================================================================
# Colors for grid-based layouts (icon grids, tiles, etc.)

[colors.grid.item]
background = "#1A1229"
hover = { outline = "#D946EF" }
selection = { outline = "#EC4899" }

# ============================================================================
# Scrollbars
# ============================================================================

[colors.scrollbars]
background = "#2D1B4E"

# ============================================================================
# Loading Indicators
# ============================================================================

[colors.loading]
bar = "#D946EF"     # shown right below the search bar when something is loading
spinner = "#F0ABFC" # used by dynamic toasts